[project]
name = "fire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "google-genai>=2.4.0",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
]
 
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v -m \"not live\""
markers = [
    "live: requires Ollama running locally and real fixture files in tests/integration/data/",
]
pythonpath = ["src"]



[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "E501",  # Line too long (handled by black)
    "F401",  # Unused imports (handled by mypy)
    "F403",  # 'from module import *' used; unable to detect undefined names (handled by mypy)
    "F405",  # Name may be undefined, or defined from star imports: module (handled by mypy)
    "N802",  # Function name should be lowercase (we use camelCase for FastAPI endpoints)
    "N803",  # Argument name should be lowercase (we use camelCase for FastAPI endpoints)
    "N806",  # Variable in function should be lowercase (we use camelCase for FastAPI endpoints)
    "N812",  # Lowercase 'date' imported as 'Date' (we do this to avoid conflicts with datetime.date)
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
